# qwen3-tts 단독 서비스. 다른 엔진과 독립적으로 뜨고 진다.
#   voicectl.sh start qwen3-tts
name: voice-qwen3-tts

services:
  qwen3-tts:
    build:
      context: ..
      dockerfile: qwen3-tts/Dockerfile
    image: voice-qwen3-tts:latest
    container_name: voice-qwen3-tts
    # 명시적으로 stop 하면 다시 뜨지 않는다 (always 를 쓰면 안 됨).
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8205}:${PORT:-8205}"
    environment:
      # MIOpen(ROCm 컨볼루션 라이브러리)의 커널 DB/캐시를 볼륨에 둔다.
      #   - 컨테이너를 다시 만들어도 커널 튜닝 결과가 남아 첫 요청 지연이 줄어든다
      #   - 기본 위치(~/.cache/miopen)는 컨테이너 안이라 WSL 이 비정상 종료하면 깨진 채 남는데,
      #     그러면 conv 가 miopenStatusUnknownError 로 실패한다. 그때는 이 디렉터리를 지우면 된다
      MIOPEN_USER_DB_PATH: /models/.miopen
      MIOPEN_CUSTOM_CACHE_DIR: /models/.miopen
    env_file:
      - engine.env
      # 비밀값은 별도 파일. 없어도 기동되도록 required: false.
      - path: secrets.env
        required: false
    volumes:
      - ./models:/models
      # --- WSL ROCm GPU 접근 (AMD) ---------------------------------------
      # WSL 에는 /dev/kfd, /dev/dri 가 없다. ROCm 은 ROCDXG(librocdxg) 시임을 거쳐
      # /dev/dxg 로 붙으므로 아래 3개 라이브러리를 호스트에서 그대로 넣어준다.
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
      - /opt/rocm/lib/librocdxg.so:/usr/lib/librocdxg.so:ro
      - /opt/rocm/share/rocdxg/dids.conf:/usr/share/rocdxg/dids.conf:ro
    devices:
      - /dev/dxg
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: ${SHM_SIZE:-8gb}
    mem_limit: ${MEM_LIMIT:-8g}
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
