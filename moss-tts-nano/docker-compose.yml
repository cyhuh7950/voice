# moss-tts-nano 단독 서비스. 다른 엔진과 독립적으로 뜨고 진다.
#   voicectl.sh start moss-tts-nano
#
# 이 엔진은 CPU 전용이라 다른 엔진과 달리 /dev/dxg · ROCDXG 마운트가 없다.
name: voice-moss-tts-nano

services:
  moss-tts-nano:
    build:
      context: ..
      dockerfile: moss-tts-nano/Dockerfile
    image: voice-moss-tts-nano:latest
    container_name: voice-moss-tts-nano
    # 명시적으로 stop 하면 다시 뜨지 않는다 (always 를 쓰면 안 됨).
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8207}:${PORT:-8207}"
    env_file:
      - engine.env
      # 비밀값은 별도 파일. 없어도 기동되도록 required: false.
      - path: secrets.env
        required: false
    volumes:
      - ./models:/models
    cpus: ${CPUS:-6}
    mem_limit: ${MEM_LIMIT:-4g}
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
