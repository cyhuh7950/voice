# whisper STT 단독 서비스. 다른 엔진과 완전히 독립적으로 뜨고 진다.
#   voicectl.sh start whisper   (권장 — engine.env 를 --env-file 로 넘겨준다)
#   docker compose --env-file engine.env up -d
name: voice-whisper

services:
  whisper:
    build:
      context: ..
      dockerfile: whisper/Dockerfile
    image: voice-whisper:latest
    container_name: voice-whisper
    # 명시적으로 stop 하면 다시 뜨지 않는다 (always 를 쓰면 안 됨).
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8101}:${PORT:-8101}"
    env_file:
      - engine.env
      # 비밀값은 별도 파일. 없어도 기동되도록 required: false.
      - path: secrets.env
        required: false
    volumes:
      # 모델 캐시를 폴더에 남겨 재시작/재빌드 시 다시 받지 않는다.
      - ./models:/models
    mem_limit: ${MEM_LIMIT:-3g}
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
