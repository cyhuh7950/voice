# moonshine STT 단독 서비스. 다른 엔진과 독립적으로 뜨고 진다.
#   voicectl.sh start moonshine
name: voice-moonshine

services:
  moonshine:
    build:
      context: ..
      dockerfile: moonshine/Dockerfile
    image: voice-moonshine:latest
    container_name: voice-moonshine
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8102}:${PORT:-8102}"
    env_file:
      - engine.env
      # 비밀값은 별도 파일. 없어도 기동되도록 required: false.
      - path: secrets.env
        required: false
    volumes:
      - ./models:/models
    mem_limit: ${MEM_LIMIT:-2g}
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
